<div id="root"></div>
<script>

  var K = window.Kontener, h = React.createElement;
  var full = /full/.test(location.search);
  var OFFERS = window.KT_OFFERS_URL || '../OffersPage/preview.html';
  function Page() {
    var l = React.useState(window.KT_LANG || 'pl'), lang = l[0], setLangState = l[1];
    // on the built site each language has its own URL; in previews the switch just re-renders
    function setLang(x) { var u = window.KT_LANG_URLS; if (u && u[x]) { location.href = u[x] + location.hash; } else setLangState(x); }
    var ok = React.useState(0), openKey = ok[0], setOpenKey = ok[1];
    var rootRef = React.useRef(null), casesRef = React.useRef(null);
    K.motion.useReveal(rootRef);
    K.useRates(); // NBP table A once per day; prices re-render when it arrives
    function search(x) {
      var q = new URLSearchParams(), f = x.filters || {};
      if (x.query) q.set('q', x.query);
      if (f.status && f.status[0]) q.set('status', f.status[0]);
      if (f.drive && f.drive[0]) q.set('drive', f.drive[0]);
      if (f.body && f.body[0]) q.set('body', f.body[0]);
      if (f.priceMax) q.set('max', f.priceMax);
      try { sessionStorage.setItem('kt-search', q.toString()); } catch (e) {}
      location.href = OFFERS + '?' + q.toString();
    }
    // every call to action opens the same lead form, pre-filled with the car it came from
    var lf = React.useState(null), lead = lf[0], setLead = lf[1];
    function deposit(o) { setLead({ kind: 'deposit', summary: K.leadSummary(o, lang) }); }
    function reserve(c) { setLead({ kind: 'reserve', summary: K.leadSummary({ car: c }, lang) }); }
    function testDrive(c) { setLead({ kind: 'testdrive', summary: K.leadSummary({ car: c }, lang) }); }
    var cs = React.useState(null), calc = cs[0], setCalc = cs[1];
    function quote() { setCalc({ car: null }); }
    function calcOrder(v, r, car) { setCalc(null); setLead({ kind: 'quote', summary: K.calcSummary(v, r, car, lang) }); }
    var s = K.copy[lang];
    return h(React.Fragment, null,
      h(React.Fragment, null,
        h('div', { ref: rootRef, lang: lang },
          h(K.NavBar, { lang: lang, onLang: setLang, onQuote: quote, home: '#', links: ['#zamow', '#od-reki', '#o-nas', '#gwarancja', function () { setLead({ kind: 'inquiry', summary: '' }); }] }),
          // 1 · search first, like the reference site, on a stage where container doors open
          h(K.HomeHero, { lang: lang, onSearch: search }),
          h('div', { className: 'wrap' },
            // 2 · the cases: click one and it zooms open right there, with trims, colours and the landed price
            h('div', { className: 'sec sec-first', id: 'zamow', ref: casesRef },
              h('div', { 'data-reveal': '' }, h(K.SectionHeader, { kind: 'order', index: '01', lang: lang, action: false })),
              h(K.CarBoxGarage, { lang: lang, openIndex: 0, openKey: openKey, onDeposit: deposit, onCalc: quote })),
            // 3 · China → Poland, whichever way the car travels
            h('div', { id: 'jak-to-dziala' }, h(K.ImportJourney, { lang: lang, top: 60, still: full })),
            // 4 · cars already in Poland
            h('div', { className: 'sec', id: 'od-reki' },
              h('div', { 'data-reveal': '' }, h(K.SectionHeader, { kind: 'stock', index: '02', lang: lang, href: OFFERS + '?status=stock' })),
              h('div', { className: 'grid3' }, K.SAMPLE_STOCK.map(function (x, i) { return h('div', { key: x.id, 'data-reveal': '', style: { '--i': i } }, h(K.StockCard, { car: x, lang: lang, onReserve: reserve, onTestDrive: testDrive })); })))),
          // 5 · who we are (a strip of featured models with real photos goes above this later)
          h('div', { className: 'wrap' },
            h('section', { className: 'kt-about', id: 'o-nas', 'aria-label': s.about },
              h('div', { className: 'kt-about-head' },
                h('span', { className: 'kt-label', 'data-reveal': '' }, s.about),
                h(K.ScrollWords, { key: lang, lang: lang, text: s.aboutText })),
              h('div', { 'data-reveal': '' }, h(K.StatRow, { key: lang, lang: lang })),
              s.sampleNote ? h('p', { className: 'kt-about-note' }, s.sampleNote) : null,
              h('div', null,
                h('div', { className: 'kt-about-sub', 'data-reveal': '' }, h('h3', null, s.officesTitle)),
                h(K.OfficeClocks, { lang: lang })),
              h('div', null,
                h('div', { className: 'kt-about-sub', 'data-reveal': '' }, h('h3', null, s.whyTitle)),
                h(K.WhyUs, { lang: lang }))),
            // 6 · the questions every buyer asks, answered in place
            h('div', { className: 'sec' }, h(K.FAQ, { lang: lang })),
            h('div', { className: 'sec sec-pair' },
              h('div', { 'data-reveal': '', id: 'gwarancja', style: { scrollMarginTop: 84 } }, h(K.ReservedSection, { kind: 'aftersales', index: '03', lang: lang })),
              h('div', { 'data-reveal': '' }, h(K.ReservedSection, { kind: 'privacy', index: '04', lang: lang }))),
            h('div', { className: 'gap' })),
          h(K.Footer, { lang: lang, onLang: setLang }),
          // phones: calculator + a question, once the hero is behind you
          h(K.MobileBar, { lang: lang, after: 560, onCalc: quote, onAsk: function () { setLead({ kind: 'inquiry', summary: '' }); } }),
          h(K.CalcDrawer, { open: !!calc, car: calc && calc.car, lang: lang, onClose: function () { setCalc(null); }, onOrder: calcOrder }),
          h(K.LeadForm, { open: !!lead, context: lead || {}, lang: lang, onClose: function () { setLead(null); } }))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Page));

</script>
